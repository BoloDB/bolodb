# HSTS only on requests that actually arrived over HTTPS. This container serves
# plain HTTP and expects TLS to be terminated in front of it, so emitting the
# header unconditionally would pin a browser to HTTPS for any host it is reached
# on — including a local http:// deployment, which it would then refuse to load.
map $http_x_forwarded_proto $hsts_header {
    https "max-age=31536000; includeSubDomains";
    default "";
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers ──
    # `always` so they are sent on error responses too — a 404 or a 502 renders
    # in the same browser as everything else.
    #
    # Careful with add_header anywhere below: nginx inherits these into a
    # location only when that location declares no add_header of its own. A
    # single one in a nested block silently drops all of them for that route.
    add_header Strict-Transport-Security $hsts_header always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Content-Security-Policy, in Report-Only for now — see docs below.
    #
    # Report-Only rather than enforcing because two of the origins this app
    # talks to are per-deployment and not knowable here: the Supabase project
    # URL (SUPABASE_URL) and the PostHog host (PUBLIC_POSTHOG_HOST). An
    # enforcing policy that omits them would break sign-in and analytics in
    # exactly the deployments we cannot test from this repo.
    #
    # 'unsafe-inline' in script-src covers the theme bootstrap in app.html,
    # which runs before hydration to avoid a flash of the wrong theme. Removing
    # it needs a nonce, which a static nginx cannot mint per request.
    #
    # BEFORE ENFORCING: add your SUPABASE_URL and PostHog host to connect-src,
    # confirm the browser console reports no violations, then rename the header
    # to Content-Security-Policy.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://us.i.posthog.com https://*.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # ── Reverse-proxy API calls to the FastAPI backend ──
    location /api/ {
        proxy_pass         http://backend:4321;
        proxy_http_version 1.1;
        proxy_buffering     off;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Cookie            $http_cookie;
        proxy_pass_header  Set-Cookie;

        # Generous timeouts for LLM-powered query endpoints
        proxy_read_timeout    120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
    }

    # SvelteKit data requests for client-only routes
    location ~ /__data\.json {
        try_files $uri @empty_data;
    }

    location @empty_data {
        # default_type, not add_header: an add_header here would stop this
        # location inheriting the security headers declared at server level.
        default_type application/json;
        return 200 '{"type":"data","nodes":[null,null,null]}';
    }

    # ── Static SPA (adapter-static) ──
    location / {
        # /index.html is the prerendered marketing homepage; client-only
        # routes fall back to the SPA shell in 200.html.
        try_files $uri $uri.html $uri/ /200.html;
    }

    # ── Gzip compression ──
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;
}
